<style>
  :root{
    --bg:#F3F4F8; --surface:#FFFFFF; --surface-2:#E9EBF2; --ink:#141824; --muted:#646B7D; --line:#DADDE7;
    --accent:#2350A8; --accent-ink:#FFFFFF; --accent-soft:#E1E8F7;
    --ok:#1D7A4E; --ok-soft:#DDF0E5; --late:#B3261E; --late-soft:#F8E1DF; --wait:#8A5A00; --wait-soft:#F7EBD3;
    --shadow:0 1px 2px rgba(20,24,36,.06),0 10px 28px rgba(20,24,36,.08);
    --radius:14px; color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0E1118; --surface:#171B25; --surface-2:#212634; --ink:#E8EAF1; --muted:#9AA1B2; --line:#2A3040;
      --accent:#7FA3F0; --accent-ink:#0B1020; --accent-soft:#1D2842;
      --ok:#6BD39B; --ok-soft:#15301F; --late:#FF8A80; --late-soft:#3A1917; --wait:#F0BE5E; --wait-soft:#33270F;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0E1118; --surface:#171B25; --surface-2:#212634; --ink:#E8EAF1; --muted:#9AA1B2; --line:#2A3040;
    --accent:#7FA3F0; --accent-ink:#0B1020; --accent-soft:#1D2842;
    --ok:#6BD39B; --ok-soft:#15301F; --late:#FF8A80; --late-soft:#3A1917; --wait:#F0BE5E; --wait-soft:#33270F;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4); color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    font-size:15px;line-height:1.4;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;
    -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  button{font:inherit;color:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
  input,select,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
  [hidden]{display:none!important}

  header{flex:0 0 auto;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 6px}
  .top{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:36px}
  h1{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:0}
  .mesnav{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
  .mesnav button{background:none;border:none;width:32px;height:30px;border-radius:999px;font-size:18px;color:var(--accent);padding:0}
  .mesnav span{font-size:13px;font-weight:600;min-width:104px;text-align:center}

  main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  .wrap{padding:6px 16px 110px;display:flex;flex-direction:column;gap:8px;max-width:640px;margin:0 auto}

  .banner{border-radius:12px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:10px}
  .banner.warn{background:var(--wait-soft);color:var(--wait)}
  .banner.err{background:var(--late-soft);color:var(--late)}
  .banner button{margin-left:auto;flex:0 0 auto;background:none;border:1px solid currentColor;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:600;color:inherit}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 11px;min-width:0}
  .stat .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat .v{font-size:18px;font-weight:700;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stat.ok .v{color:var(--ok)} .stat.late .v{color:var(--late)}
  .progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:2px}
  .progress i{display:block;height:100%;background:var(--ok);border-radius:99px}
  .progtxt{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}

  .sec{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin:14px 4px 0;display:flex;justify-content:space-between;align-items:baseline}
  .sec small{font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}
  .group{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line);min-height:56px}
  .item:last-child{border-bottom:none}
  .item.tap{cursor:pointer}
  .item.tap:active{background:var(--surface-2)}
  .av{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent)}
  .av.off{background:var(--surface-2);color:var(--muted)}
  .it-main{flex:1 1 auto;min-width:0}
  .it-t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it-s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .it-r{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .it-v{font-size:14.5px;font-weight:600}
  .chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
  .chip.ok{background:var(--ok-soft);color:var(--ok)}
  .chip.late{background:var(--late-soft);color:var(--late)}
  .chip.wait{background:var(--wait-soft);color:var(--wait)}
  .chip.part{background:var(--wait-soft);color:var(--wait)}
  .mini{flex:0 0 auto;border:none;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
  .mini.ghost{background:var(--surface-2);color:var(--ink)}
  .mini:active{filter:brightness(.92)}
  .acts{display:flex;gap:6px;flex:0 0 auto}
  .wa{width:36px;height:34px;padding:0;display:grid;place-items:center;border-radius:10px;border:none;background:var(--ok-soft);color:var(--ok)}
  .wa svg{width:18px;height:18px;fill:currentColor}

  .empty{text-align:center;color:var(--muted);padding:32px 18px;font-size:14px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--surface)}
  .empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
  .empty ol{text-align:left;display:inline-block;margin:8px 0 12px;padding-left:20px}
  .empty .mini{margin-top:4px}

  .search{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px}
  .seg{display:flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:3px}
  .seg button{flex:1 1 0;border:none;background:none;padding:7px 6px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

  .fab{position:absolute;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:18px;border:none;background:var(--accent);color:var(--accent-ink);font-size:30px;line-height:1;padding:0 0 3px;box-shadow:var(--shadow);z-index:5}
  .fab:active{transform:scale(.95)}

  nav{flex:0 0 auto;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 6px env(safe-area-inset-bottom,0px)}
  nav button{flex:1 1 0;background:none;border:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10.5px;font-weight:600}
  nav svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  nav button[aria-current="true"]{color:var(--accent)}
  nav .badge{position:absolute;margin-left:18px;margin-top:-2px;min-width:16px;height:16px;border-radius:99px;background:var(--late);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px}
  nav .ic{position:relative;display:flex;justify-content:center}

  .backdrop{position:fixed;inset:0;background:rgba(10,12,20,.45);z-index:20;opacity:0;transition:opacity .18s}
  .backdrop.on{opacity:1}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:var(--shadow);
    padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    max-width:640px;margin:0 auto;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.3,1)}
  .sheet.on{transform:none}
  @media (prefers-reduced-motion: reduce){.backdrop,.sheet,.toast{transition:none}}
  .grab{width:38px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .sheet h2{font-size:19px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
  .sheet .lead{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field input,.field select,.field textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:16px;min-height:46px}
  .field textarea{min-height:64px;resize:vertical}
  .field .hint{font-size:12px;color:var(--muted)}
  .two{display:flex;gap:10px}
  .two .field{flex:1 1 0}
  .btn{display:block;width:100%;border:none;border-radius:13px;padding:14px;font-size:16px;font-weight:700;background:var(--accent);color:var(--accent-ink);margin-top:6px;text-align:center}
  .btn:active{filter:brightness(.93)}
  .btn.ghost{background:var(--surface-2);color:var(--ink);margin-top:10px}
  .btn.danger{background:var(--late-soft);color:var(--late);margin-top:10px}
  .btn.ok{background:var(--ok);color:#fff}
  .btn:disabled{opacity:.45}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;background:var(--bg);border:1px solid var(--line);border-radius:11px;margin-bottom:12px}
  .switch b{font-weight:600}
  .switch small{display:block;color:var(--muted);font-size:12px}
  .tg{position:relative;width:51px;height:31px;flex:0 0 auto}
  .tg input{opacity:0;width:0;height:0;position:absolute}
  .tg span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s}
  .tg span::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
  .tg input:checked + span{background:var(--ok)}
  .tg input:checked + span::after{transform:translateX(20px)}
  .meses{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 14px}
  .mc{border-radius:10px;padding:7px 4px;text-align:center;font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--muted);border:none}
  .mc b{display:block;font-size:10px;font-weight:600;opacity:.85}
  .mc.ok{background:var(--ok-soft);color:var(--ok)}
  .mc.late{background:var(--late-soft);color:var(--late)}
  .mc.wait{background:var(--wait-soft);color:var(--wait)}
  .mc.part{background:var(--wait-soft);color:var(--wait)}
  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv span:first-child{color:var(--muted)}
  .kv span:last-child{text-align:right;font-weight:500}
  .row-actions{display:flex;gap:8px;margin-bottom:14px}
  .row-actions .btn{margin-top:0}

  .toast{position:absolute;left:16px;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:13px;box-shadow:var(--shadow);
    padding:11px 10px 11px 14px;display:flex;align-items:center;gap:10px;font-size:14px;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;max-width:608px;margin:0 auto}
  .toast.on{opacity:1;transform:none}
  .toast span{flex:1 1 auto;min-width:0}
  .toast button{flex:0 0 auto;background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
  .note{font-size:12.5px;color:var(--muted);padding:2px 4px}
</style>
</head>
<body>

<header>
  <div class="top">
    <h1 id="titulo">Resumo</h1>
    <div class="mesnav" id="mesnav">
      <button id="mesPrev" aria-label="Mês anterior">‹</button>
      <span id="mesLbl"></span>
      <button id="mesNext" aria-label="Mês seguinte">›</button>
    </div>
  </div>
</header>

<main id="main">
  <div class="wrap" id="banners" style="padding-bottom:8px"></div>
  <section class="wrap" id="v-resumo" style="padding-top:0"></section>
  <section class="wrap" id="v-alunos" style="padding-top:0" hidden>
    <input class="search" id="qAlunos" type="search" placeholder="Procurar aluno" autocomplete="off">
    <div class="seg" id="segAlunos">
      <button data-f="ativos" aria-pressed="true">Ativos</button>
      <button data-f="inativos" aria-pressed="false">Inativos</button>
      <button data-f="todos" aria-pressed="false">Todos</button>
    </div>
    <div id="listAlunos"></div>
  </section>
  <section class="wrap" id="v-pag" style="padding-top:0" hidden></section>
  <section class="wrap" id="v-def" style="padding-top:0" hidden></section>
</main>

<button class="fab" id="fab" aria-label="Adicionar" hidden>+</button>
<div class="toast" id="toast" hidden role="status" aria-live="polite"><span id="toastTxt"></span><button id="toastBtn" type="button">Anular</button></div>

<nav id="nav">
  <button data-v="resumo" aria-current="true"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/></svg><span class="badge" id="badge" hidden></span></span>Resumo</button>
  <button data-v="alunos"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.6.1 4.5 1.8 5 4.6"/></svg></span>Alunos</button>
  <button data-v="pag"><span class="ic"><svg viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/><path d="M2.5 10h19M6.5 14.5h4"/></svg></span>Pagamentos</button>
  <button data-v="def"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></span>Definições</button>
</nav>

<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true"></div>
<input type="file" id="fileImport" accept=".json,.txt,application/json,text/plain" hidden>

<script>
(function () {
  "use strict";

  /* ================= utilitários ================= */
  var CHAVE = "mensalidades.v1";
  var $ = function (id) { return document.getElementById(id); };
  var eur = new Intl.NumberFormat("pt-PT", { style: "currency", currency: "EUR" });
  var money = function (c) { return eur.format((c || 0) / 100); };
  var paraCent = function (v) {
    var n = parseFloat(String(v == null ? "" : v).replace(/\s|€/g, "").replace(",", "."));
    return isFinite(n) ? Math.max(0, Math.round(n * 100)) : 0;
  };
  var centTxt = function (c) { return c ? (c / 100).toFixed(2).replace(".", ",").replace(/,00$/, "") : ""; };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var pad = function (n) { return String(n).padStart(2, "0"); };
  var hojeISO = function () { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
  var mesDe = function (d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1); };
  var mesAtual = function () { return mesDe(new Date()); };
  var addMes = function (m, n) { var p = m.split("-"); var d = new Date(+p[0], +p[1] - 1 + n, 1); return mesDe(d); };
  var cmpMes = function (a, b) { return a < b ? -1 : a > b ? 1 : 0; };
  var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var MESES_C = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var mesNome = function (m) { var p = m.split("-"); return MESES[+p[1] - 1] + " " + p[0]; };
  var mesCurto = function (m) { var p = m.split("-"); return MESES_C[+p[1] - 1] + " " + p[0].slice(2); };
  var dataPT = function (iso) { if (!iso) return ""; var p = iso.split("-"); return p[2] + "/" + p[1] + "/" + p[0]; };
  var diasNoMes = function (m) { var p = m.split("-"); return new Date(+p[0], +p[1], 0).getDate(); };
  var iniciais = function (n) {
    var p = String(n || "?").trim().split(/\s+/);
    return ((p[0] || "?")[0] + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase();
  };
  var semAcento = function (s) { return String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); };

  /* ================= estado e gravação ================= */
  function vazio() { return { v: 1, alunos: [], planos: [], pagamentos: [], config: { dia: 8 }, ultimaCopia: null, alteradoEm: null }; }
  var estado = vazio();
  var localOK = true;

  function normalizar(v) {
    var s = vazio();
    if (!v || typeof v !== "object") return s;
    s.alunos = Array.isArray(v.alunos) ? v.alunos.filter(function (a) { return a && a.id && a.nome; }) : [];
    s.planos = Array.isArray(v.planos) ? v.planos.filter(function (p) { return p && p.id && p.nome; }) : [];
    s.pagamentos = Array.isArray(v.pagamentos) ? v.pagamentos.filter(function (p) { return p && p.id && p.alunoId && p.mes; }) : [];
    var dia = parseInt(v.config && v.config.dia, 10);
    s.config.dia = dia >= 1 && dia <= 31 ? dia : 8;
    s.ultimaCopia = v.ultimaCopia || null;
    s.alteradoEm = v.alteradoEm || null;
    return s;
  }
  function ler() {
    try { var r = localStorage.getItem(CHAVE); return r ? JSON.parse(r) : null; }
    catch (e) { localOK = false; return null; }
  }
  function gravar() {
    try { localStorage.setItem(CHAVE, JSON.stringify(estado)); localOK = true; }
    catch (e) { localOK = false; }
  }
  function salvar() { estado.alteradoEm = Date.now(); gravar(); render(); }

  /* ================= regras de negócio ================= */
  var plano = function (id) { return estado.planos.find(function (p) { return p.id === id; }) || null; };
  var aluno = function (id) { return estado.alunos.find(function (a) { return a.id === id; }) || null; };
  var diaDe = function (a) { return a && a.dia ? a.dia : estado.config.dia; };
  var valorDe = function (a) { var p = a && plano(a.planoId); return p ? p.valor : 0; };
  var vencimento = function (a, m) { return m + "-" + pad(Math.min(diaDe(a), diasNoMes(m))); };
  var pagosDe = function (a, m) {
    return estado.pagamentos.reduce(function (t, p) { return p.alunoId === a.id && p.mes === m ? t + p.valor : t; }, 0);
  };
  /* Estado de um aluno num mês: ok | part | late | wait | na (não conta) */
  function estadoMes(a, m) {
    var pago = pagosDe(a, m), devido = valorDe(a);
    if (pago > 0 && (!devido || pago >= devido)) return { k: "ok", pago: pago, devido: devido };
    if (!a.ativo || cmpMes(m, a.desde || m) < 0) return { k: pago ? "part" : "na", pago: pago, devido: devido };
    var venceu = hojeISO() > vencimento(a, m);
    if (pago > 0) return { k: venceu ? "late" : "part", pago: pago, devido: devido, parcial: true };
    return { k: venceu ? "late" : "wait", pago: 0, devido: devido };
  }
  /* Meses em atraso até ao mês atual (inclusive, se já venceu). */
  function atrasos(a) {
    if (!a.ativo || !a.desde) return [];
    var r = [], m = a.desde, fim = mesAtual(), guard = 0;
    while (cmpMes(m, fim) <= 0 && guard++ < 240) {
      if (estadoMes(a, m).k === "late") r.push(m);
      m = addMes(m, 1);
    }
    return r;
  }
  function dividaTotal(a) {
    return atrasos(a).reduce(function (t, m) { var e = estadoMes(a, m); return t + Math.max(0, e.devido - e.pago); }, 0);
  }
  var CHIP = {
    ok: ["ok", "Pago"], part: ["part", "Parcial"], late: ["late", "Atrasado"], wait: ["wait", "Por pagar"], na: ["", "—"]
  };
  function chipHtml(e, a, m) {
    var c = CHIP[e.k];
    var txt = c[1];
    if (e.k === "wait") txt = "Vence " + pad(Math.min(diaDe(a), diasNoMes(m))) + "/" + m.split("-")[1];
    if (e.k === "late" && e.parcial) txt = "Falta " + money(e.devido - e.pago);
    return '<span class="chip ' + c[0] + '">' + esc(txt) + '</span>';
  }

  /* ================= undo / toast ================= */
  var snap = function () { return JSON.parse(JSON.stringify(estado)); };
  var toastT = null;
  function toast(txt, antes) {
    var el = $("toast"), b = $("toastBtn");
    $("toastTxt").textContent = txt;
    b.hidden = !antes;
    b.onclick = antes ? function () { esconder(); estado = antes; salvar(); toast("Anulado"); } : null;
    el.hidden = false;
    requestAnimationFrame(function () { el.classList.add("on"); });
    clearTimeout(toastT);
    toastT = setTimeout(esconder, antes ? 7000 : 2800);
  }
  function esconder() {
    var el = $("toast"); el.classList.remove("on"); clearTimeout(toastT);
    toastT = setTimeout(function () { el.hidden = true; }, 200);
  }

  /* ================= sheet ================= */
  var sheetEl = $("sheet"), backEl = $("backdrop");
  function abrir(html, depois) {
    sheetEl.onclick = null; sheetEl.oninput = null; sheetEl.onchange = null;
    sheetEl.innerHTML = '<div class="grab"></div>' + html;
    sheetEl.hidden = false; backEl.hidden = false; sheetEl.scrollTop = 0;
    requestAnimationFrame(function () { sheetEl.classList.add("on"); backEl.classList.add("on"); });
    if (depois) depois(sheetEl);
  }
  function fechar() {
    sheetEl.classList.remove("on"); backEl.classList.remove("on");
    setTimeout(function () { sheetEl.hidden = true; backEl.hidden = true; sheetEl.innerHTML = ""; }, 200);
  }
  backEl.addEventListener("click", fechar);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !sheetEl.hidden) fechar(); });
  function confirmar(btn, rotulo, acao) {
    var armado = false, orig = btn.textContent;
    btn.addEventListener("click", function () {
      if (!armado) { armado = true; btn.textContent = rotulo; setTimeout(function () { armado = false; btn.textContent = orig; }, 4000); return; }
      acao();
    });
  }
  var q = function (s, sel) { return s.querySelector(sel); };

  /* ================= planos ================= */
  function sheetPlano(p) {
    var novo = !p;
    var usados = p ? estado.alunos.filter(function (a) { return a.planoId === p.id; }).length : 0;
    abrir(
      '<h2>' + (novo ? "Novo tipo de mensalidade" : "Editar mensalidade") + '</h2>' +
      '<p class="lead">' + (novo ? "Ex.: 2x por semana, 3x por semana, livre-trânsito…" : usados + (usados === 1 ? " aluno usa" : " alunos usam") + " esta mensalidade.") + '</p>' +
      '<div class="field"><label for="pl-n">Nome</label><input id="pl-n" type="text" autocomplete="off" placeholder="Ex.: 2x por semana" value="' + esc(p ? p.nome : "") + '"></div>' +
      '<div class="field"><label for="pl-v">Valor por mês (€)</label><input id="pl-v" type="text" inputmode="decimal" placeholder="0,00" value="' + (p ? centTxt(p.valor) : "") + '"></div>' +
      '<button class="btn" id="pl-ok">' + (novo ? "Criar" : "Guardar") + '</button>' +
      (novo ? '' : '<button class="btn danger" id="pl-del">Apagar mensalidade</button>'),
      function (s) {
        if (novo) setTimeout(function () { q(s, "#pl-n").focus(); }, 250);
        q(s, "#pl-ok").addEventListener("click", function () {
          var nome = q(s, "#pl-n").value.trim();
          if (!nome) { q(s, "#pl-n").focus(); return; }
          var antes = snap();
          if (novo) estado.planos.push({ id: uid(), nome: nome, valor: paraCent(q(s, "#pl-v").value) });
          else { p.nome = nome; p.valor = paraCent(q(s, "#pl-v").value); }
          salvar(); fechar(); toast(novo ? "Mensalidade criada" : "Mensalidade guardada", antes);
        });
        var d = q(s, "#pl-del");
        if (d) confirmar(d, usados ? "Confirmar (" + usados + " ficam sem mensalidade)" : "Confirmar: apagar", function () {
          var antes = snap();
          estado.planos = estado.planos.filter(function (x) { return x.id !== p.id; });
          estado.alunos.forEach(function (a) { if (a.planoId === p.id) a.planoId = null; });
          salvar(); fechar(); toast("Mensalidade apagada", antes);
        });
      }
    );
  }

  /* ================= alunos ================= */
  function opcoesPlano(sel) {
    return '<option value="">— Sem mensalidade —</option>' + estado.planos.map(function (p) {
      return '<option value="' + p.id + '"' + (p.id === sel ? " selected" : "") + '>' + esc(p.nome) + ' · ' + money(p.valor) + '</option>';
    }).join("");
  }
  function sheetAlunoForm(a) {
    var novo = !a;
    var inicio = a ? (a.inicio || a.desde || mesAtual()) : mesAtual();
    abrir(
      '<h2>' + (novo ? "Novo aluno" : "Editar aluno") + '</h2><p class="lead">' + (novo ? "Só o nome é obrigatório." : esc(a.nome)) + '</p>' +
      '<div class="field"><label for="al-n">Nome</label><input id="al-n" type="text" autocomplete="off" autocapitalize="words" value="' + esc(a ? a.nome : "") + '"></div>' +
      '<div class="field"><label for="al-p">Tipo de mensalidade</label><select id="al-p">' + opcoesPlano(a ? a.planoId : (estado.planos[0] || {}).id) + '</select>' +
        (estado.planos.length ? '' : '<span class="hint">Ainda não há tipos de mensalidade — cria-os em Definições.</span>') + '</div>' +
      '<div class="two">' +
        '<div class="field"><label for="al-i">Começou em</label><input id="al-i" type="month" value="' + inicio + '"></div>' +
        '<div class="field"><label for="al-d">Dia de pagamento</label><input id="al-d" type="number" inputmode="numeric" min="1" max="31" placeholder="Geral (' + estado.config.dia + ')" value="' + (a && a.dia ? a.dia : "") + '"></div>' +
      '</div>' +
      '<div class="field"><label for="al-t">Telemóvel (para lembretes por WhatsApp)</label><input id="al-t" type="tel" inputmode="tel" autocomplete="off" placeholder="9xx xxx xxx" value="' + esc(a ? a.tel || "" : "") + '"></div>' +
      '<label class="switch"><span><b>Ativo</b><small>Alunos inativos não aparecem como atrasados.</small></span><span class="tg"><input id="al-a" type="checkbox"' + (!a || a.ativo ? " checked" : "") + '><span></span></span></label>' +
      '<div class="field"><label for="al-o">Notas</label><textarea id="al-o" rows="2">' + esc(a ? a.notas || "" : "") + '</textarea></div>' +
      '<button class="btn" id="al-ok">' + (novo ? "Adicionar aluno" : "Guardar") + '</button>' +
      (novo ? '' : '<button class="btn danger" id="al-del">Apagar aluno e os pagamentos dele</button>'),
      function (s) {
        if (novo) setTimeout(function () { q(s, "#al-n").focus(); }, 250);
        q(s, "#al-ok").addEventListener("click", function () {
          var nome = q(s, "#al-n").value.trim();
          if (!nome) { q(s, "#al-n").focus(); return; }
          var antes = snap();
          var ini = /^\d{4}-\d{2}$/.test(q(s, "#al-i").value) ? q(s, "#al-i").value : mesAtual();
          var dia = parseInt(q(s, "#al-d").value, 10);
          var ativo = q(s, "#al-a").checked;
          var dados = {
            nome: nome, planoId: q(s, "#al-p").value || null, inicio: ini,
            dia: dia >= 1 && dia <= 31 ? dia : null, tel: q(s, "#al-t").value.trim(),
            notas: q(s, "#al-o").value.trim()
          };
          if (novo) {
            var n = Object.assign({ id: uid(), ativo: ativo, desde: ini, criadoEm: Date.now(), historico: [] }, dados);
            estado.alunos.push(n);
          } else {
            var inicioMudou = dados.inicio !== a.inicio;
            Object.assign(a, dados);
            if (inicioMudou && (!a.historico || !a.historico.length)) a.desde = ini;
            mudarAtivo(a, ativo);
          }
          salvar(); fechar(); toast(novo ? nome + " adicionado" : "Aluno guardado", antes);
        });
        var d = q(s, "#al-del");
        if (d) confirmar(d, "Confirmar: apagar " + a.nome, function () {
          var antes = snap();
          estado.alunos = estado.alunos.filter(function (x) { return x.id !== a.id; });
          estado.pagamentos = estado.pagamentos.filter(function (p) { return p.alunoId !== a.id; });
          salvar(); fechar(); toast(a.nome + " apagado", antes);
        });
      }
    );
  }
  /* Ao reativar, as contas recomeçam no mês atual (os meses parado não contam como dívida). */
  function mudarAtivo(a, ativo) {
    if (!!a.ativo === !!ativo) return;

    a.historico.push({ ts: Date.now(), ativo: ativo });
    if (ativo) {
      a.ativo = true;
      a.desde = mesAtual();

      a.ativo = false;

  }

  function sheetAluno(a) {

      function (s) {

  function whatsapp(a, m) {
    var tel = String(a.tel || "").replace(/[^\d+]/g, "");
    if (!tel) return;
    if (tel[0] === "+") tel = tel.slice(1);
    else if (tel.length === 9) tel = "351" + tel;
    var atr = atrasos(a);
    var mm = m || atr[0] || mesAtual();
    var e = estadoMes(a, mm);
    var valor = e.devido ? " (" + money(Math.max(0, e.devido - e.pago)) + ")" : "";
    var txt = "Olá " + a.nome.split(" ")[0] + "! Só a lembrar a mensalidade de " + mesNome(mm) + valor + ". Obrigado!";
    if (atr.length > 1) txt = "Olá " + a.nome.split(" ")[0] + "! Só a lembrar que tens " + atr.length + " mensalidades em atraso (" +
      atr.map(mesNome).join(", ") + ") — " + money(dividaTotal(a)) + " no total. Obrigado!";
    window.location.href = "https://wa.me/" + tel + "?text=" + encodeURIComponent(txt);
  }

  /* ================= pagamentos ================= */
  function sheetPagamento(p) {
    var novo = !p.id;
    var ativos = estado.alunos.slice().sort(function (x, y) { return x.nome.localeCompare(y.nome, "pt"); });
    if (!ativos.length) { toast("Adiciona primeiro um aluno."); return; }
    var aId = p.alunoId || (ativos.find(function (a) { return a.ativo; }) || ativos[0]).id;

    function mesesPara(a, sel) {
      var hoje = mesAtual(), ini = a.inicio || a.desde || hoje;
      var de = cmpMes(addMes(hoje, -12), ini) > 0 ? addMes(hoje, -12) : ini;
      if (sel && cmpMes(sel, de) < 0) de = sel;
      var out = [], m = addMes(hoje, 2);
      while (cmpMes(m, de) >= 0) { out.push(m); m = addMes(m, -1); }
      if (!sel) sel = atrasos(a)[0] || (estadoMes(a, hoje).k !== "ok" ? hoje : addMes(hoje, 1));
      return out.map(function (mm) {
        var e = estadoMes(a, mm);
        var tag = e.k === "ok" ? " ✓ pago" : e.k === "late" ? " · em atraso" : e.k === "part" ? " · parcial" : "";
        return '<option value="' + mm + '"' + (mm === sel ? " selected" : "") + '>' + mesNome(mm) + tag + '</option>';
      }).join("");
    }
    function sugerido(a, m) {
      var e = estadoMes(a, m);
      return e.devido ? Math.max(0, e.devido - (novo ? e.pago : e.pago - (p.valor || 0))) || e.devido : 0;
    }
    var a0 = aluno(aId);
    var mes0 = p.mes;
    abrir(
      '<h2>' + (novo ? "Registar pagamento" : "Pagamento") + '</h2><p class="lead">' + (novo ? "O valor vem da mensalidade do aluno — podes alterar." : "Registado a " + dataPT(p.data) + ".") + '</p>' +
      '<div class="field"><label for="pg-a">Aluno</label><select id="pg-a">' + ativos.map(function (a) {
        return '<option value="' + a.id + '"' + (a.id === aId ? " selected" : "") + '>' + esc(a.nome) + (a.ativo ? "" : " (inativo)") + '</option>';
      }).join("") + '</select></div>' +
      '<div class="field"><label for="pg-m">Mês que está a pagar</label><select id="pg-m">' + mesesPara(a0, mes0) + '</select></div>' +
      '<div class="two">' +
        '<div class="field"><label for="pg-v">Valor (€)</label><input id="pg-v" type="text" inputmode="decimal" placeholder="0,00"></div>' +
        '<div class="field"><label for="pg-d">Data</label><input id="pg-d" type="date" value="' + (p.data || hojeISO()) + '"></div>' +
      '</div>' +
      '<div class="field"><label for="pg-t">Forma de pagamento</label><select id="pg-t">' +
        ["Dinheiro", "MB WAY", "Transferência", "Multibanco", "Outro"].map(function (t) {
          return '<option' + ((p.metodo || "Dinheiro") === t ? " selected" : "") + '>' + t + '</option>';
        }).join("") + '</select></div>' +
      '<div class="field"><label for="pg-n">Nota (opcional)</label><input id="pg-n" type="text" autocomplete="off" value="' + esc(p.nota || "") + '"></div>' +
      '<button class="btn ok" id="pg-ok">' + (novo ? "Registar" : "Guardar") + '</button>' +
      (novo ? '' : '<button class="btn danger" id="pg-del">Apagar pagamento</button>'),
      function (s) {
        var selA = q(s, "#pg-a"), selM = q(s, "#pg-m"), inV = q(s, "#pg-v");
        inV.value = novo ? centTxt(sugerido(a0, selM.value)) : centTxt(p.valor);
        selA.addEventListener("change", function () {
          var a = aluno(selA.value);
          selM.innerHTML = mesesPara(a);
          inV.value = centTxt(sugerido(a, selM.value));
        });
        selM.addEventListener("change", function () { if (novo) inV.value = centTxt(sugerido(aluno(selA.value), selM.value)); });
        q(s, "#pg-ok").addEventListener("click", function () {
          var v = paraCent(inV.value);
          if (!v) { inV.focus(); return; }
          var antes = snap();
          var dados = {
            alunoId: selA.value, mes: selM.value, valor: v,
            data: q(s, "#pg-d").value || hojeISO(), metodo: q(s, "#pg-t").value, nota: q(s, "#pg-n").value.trim()
          };
          if (novo) estado.pagamentos.push(Object.assign({ id: uid(), ts: Date.now() }, dados));
          else Object.assign(p, dados);
          salvar(); fechar();
          var a = aluno(dados.alunoId);
          toast((novo ? "Pago: " : "Guardado: ") + a.nome.split(" ")[0] + " · " + mesNome(dados.mes) + " · " + money(v), antes);
        });
        var d = q(s, "#pg-del");
        if (d) confirmar(d, "Confirmar: apagar pagamento", function () {
          var antes = snap();
          estado.pagamentos = estado.pagamentos.filter(function (x) { return x.id !== p.id; });
          salvar(); fechar(); toast("Pagamento apagado", antes);
        });
      }
    );
  }

  /* ================= cópia de segurança ================= */
  function nomeFicheiro() { return "mensalidades-copia-" + hojeISO() + ".json"; }
  function exportar() {
    var dados = JSON.parse(JSON.stringify(estado));
    dados.exportadoEm = new Date().toISOString();
    var txt = JSON.stringify(dados, null, 1);
    var marcar = function () { estado.ultimaCopia = Date.now(); gravar(); render(); };
    var ficheiro = null;
    try { ficheiro = new File([txt], nomeFicheiro(), { type: "application/json" }); } catch (e) {}
    if (ficheiro && navigator.canShare && navigator.canShare({ files: [ficheiro] })) {
      navigator.share({ files: [ficheiro], title: "Cópia das mensalidades" })
        .then(function () { marcar(); toast("Cópia guardada"); })
        .catch(function (e) { if (e && e.name !== "AbortError") descarregar(txt, marcar); });
      return;
    }
    descarregar(txt, marcar);
  }
  function descarregar(txt, feito) {
    var blob = new Blob([txt], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var link = document.createElement("a");
    link.href = url; link.download = nomeFicheiro();
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    feito(); toast("Cópia descarregada (" + nomeFicheiro() + ")");
  }
  $("fileImport").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var v;
      try { v = JSON.parse(r.result); } catch (err) { toast("Esse ficheiro não é uma cópia válida."); return; }
      if (!v || !Array.isArray(v.alunos) || !Array.isArray(v.pagamentos)) { toast("Esse ficheiro não é uma cópia das mensalidades."); return; }
      var novo = normalizar(v);
      abrir(
        '<h2>Repor cópia?</h2><p class="lead">Os dados atuais deste telemóvel são substituídos pelos da cópia.</p>' +
        '<div class="group" style="padding:0 12px;margin-bottom:12px">' +
          '<div class="kv"><span>Cópia de</span><span>' + (v.exportadoEm ? new Date(v.exportadoEm).toLocaleString("pt-PT") : "—") + '</span></div>' +
          '<div class="kv"><span>Alunos</span><span>' + novo.alunos.length + ' (agora: ' + estado.alunos.length + ')</span></div>' +
          '<div class="kv"><span>Pagamentos</span><span>' + novo.pagamentos.length + ' (agora: ' + estado.pagamentos.length + ')</span></div>' +
          '<div class="kv"><span>Mensalidades</span><span>' + novo.planos.length + '</span></div>' +
        '</div>' +
        '<button class="btn" id="im-ok">Repor esta cópia</button><button class="btn ghost" id="im-no">Cancelar</button>',
        function (s) {
          q(s, "#im-no").addEventListener("click", fechar);
          q(s, "#im-ok").addEventListener("click", function () {
            var antes = snap();
            estado = novo; salvar(); fechar(); toast("Cópia reposta", antes);
          });
        }
      );
    };
    r.readAsText(f);
  });

  /* ================= render ================= */
  var vista = "resumo", mesVista = mesAtual(), filtro = "ativos", busca = "";
  var TITULOS = { resumo: "Resumo", alunos: "Alunos", pag: "Pagamentos", def: "Definições" };

  function linhaAluno(a, m, extra) {
    var e = estadoMes(a, m), pl = plano(a.planoId);
    var atr = atrasos(a);
    var sub = pl ? esc(pl.nome) + " · " + money(pl.valor) : "sem mensalidade";
    if (extra) sub = extra;
    return '<div class="item tap" data-aluno="' + a.id + '">' +
      '<div class="av' + (a.ativo ? "" : " off") + '">' + esc(iniciais(a.nome)) + '</div>' +
      '<div class="it-main"><div class="it-t">' + esc(a.nome) + '</div><div class="it-s">' + sub + '</div></div>' +
      '<div class="it-r">' + (a.ativo ? chipHtml(e, a, m) : '<span class="chip">Inativo</span>') +
        (a.ativo && atr.length > 1 ? '<span class="chip late">' + atr.length + ' em atraso</span>' : '') + '</div></div>';
  }

  function renderResumo() {
    var el = $("v-resumo");
    if (!estado.planos.length || !estado.alunos.length) {
      el.innerHTML = '<div class="empty"><strong>Vamos começar</strong><ol>' +
        '<li' + (estado.planos.length ? ' style="text-decoration:line-through"' : '') + '>Cria os tipos de mensalidade (2x semana, 3x semana…)</li>' +
        '<li>Escolhe o dia de pagamento</li><li>Adiciona os alunos</li></ol><br>' +
        (estado.planos.length ? '<button class="mini" data-go="novoAluno">Adicionar aluno</button>' : '<button class="mini" data-go="novoPlano">Criar mensalidade</button>') + '</div>';
      return;
    }
    var m = mesVista;
    var ativos = estado.alunos.filter(function (a) { return a.ativo && cmpMes(m, a.desde || m) >= 0; });
    var late = [], wait = [], ok = [];
    var esperado = 0, recebido = 0;
    ativos.forEach(function (a) {
      var e = estadoMes(a, m);
      esperado += e.devido;
      if (e.k === "ok") ok.push(a); else if (e.k === "late") late.push(a); else wait.push(a);
    });
    recebido = estado.pagamentos.reduce(function (t, p) { return p.mes === m ? t + p.valor : t; }, 0);
    var porReceber = ativos.reduce(function (t, a) { var e = estadoMes(a, m); return t + (e.k === "ok" ? 0 : Math.max(0, e.devido - e.pago)); }, 0);
    var pct = esperado ? Math.min(100, Math.round((esperado - porReceber) / esperado * 100)) : 0;
    var byNome = function (x, y) { return x.nome.localeCompare(y.nome, "pt"); };
    late.sort(byNome); wait.sort(function (x, y) { return diaDe(x) - diaDe(y) || byNome(x, y); }); ok.sort(byNome);

    var outrosAtrasos = estado.alunos.filter(function (a) {
      return a.ativo && late.indexOf(a) < 0 && atrasos(a).some(function (mm) { return mm !== m; });
    });

    var html = '<div class="stats">' +
      '<div class="stat ok"><div class="l">Recebido</div><div class="v num">' + money(recebido) + '</div></div>' +
      '<div class="stat"><div class="l">Por receber</div><div class="v num">' + money(porReceber) + '</div></div>' +
      '<div class="stat late"><div class="l">Atrasados</div><div class="v num">' + late.length + '</div></div>' +
    '</div>' +
    '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
    '<div class="progtxt"><span>' + ok.length + ' de ' + ativos.length + ' pagos</span><span>dia de pagamento: ' + estado.config.dia + '</span></div>';

    var bloco = function (titulo, lista, acoes) {
      if (!lista.length) return "";
      return '<div class="sec">' + titulo + '<small>' + lista.length + '</small></div><div class="group">' +
        lista.map(function (a) {
          if (!acoes) return linhaAluno(a, m);
          var e = estadoMes(a, m);
          return '<div class="item tap" data-aluno="' + a.id + '"><div class="av">' + esc(iniciais(a.nome)) + '</div>' +
            '<div class="it-main"><div class="it-t">' + esc(a.nome) + '</div><div class="it-s">' +
              (e.parcial ? "Pagou " + money(e.pago) + " de " + money(e.devido) : money(e.devido) + " · venceu a " + dataPT(vencimento(a, m)).slice(0, 5)) +
              (atrasos(a).length > 1 ? " · " + atrasos(a).length + " meses em atraso" : "") + '</div></div>' +
            '<div class="acts">' + (a.tel ? '<button class="wa" data-wa="' + a.id + '" aria-label="Lembrar por WhatsApp"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.2-.2-.4-.3z"/></svg></button>' : '') +
              '<button class="mini" data-pagar="' + a.id + '">Pagar</button></div></div>';
        }).join("") + '</div>';
    };
    html += bloco("Atrasados", late, true);
    if (outrosAtrasos.length && m === mesAtual()) {
      html += '<div class="sec">Com meses anteriores em atraso<small>' + outrosAtrasos.length + '</small></div><div class="group">' +
        outrosAtrasos.map(function (a) {
          var at = atrasos(a);
          return linhaAluno(a, m, at.length + (at.length === 1 ? " mês" : " meses") + " · " + money(dividaTotal(a)) + " · " + at.map(mesCurto).join(", "));
        }).join("") + '</div>';
    }
    html += bloco("Por pagar", wait, false);
    html += bloco("Pagos", ok, false);
    if (!ativos.length) html += '<div class="empty">Sem alunos ativos em ' + mesNome(m) + '.</div>';
    el.innerHTML = html;
  }

  function renderAlunos() {
    var lista = estado.alunos.filter(function (a) {
      if (filtro === "ativos" && !a.ativo) return false;
      if (filtro === "inativos" && a.ativo) return false;
      return !busca || semAcento(a.nome).indexOf(semAcento(busca)) >= 0;
    }).sort(function (x, y) { return x.nome.localeCompare(y.nome, "pt"); });
    Array.prototype.forEach.call($("segAlunos").children, function (b) {
      var n = estado.alunos.filter(function (a) { return b.dataset.f === "todos" || (b.dataset.f === "ativos") === !!a.ativo; }).length;
      b.textContent = { ativos: "Ativos", inativos: "Inativos", todos: "Todos" }[b.dataset.f] + " (" + n + ")";
    });
    if (!estado.alunos.length) {
      $("listAlunos").innerHTML = '<div class="empty"><strong>Sem alunos</strong>Carrega no <b>+</b> para adicionar o primeiro.</div>';
      return;
    }
    $("listAlunos").innerHTML = lista.length ? '<div class="group">' + lista.map(function (a) { return linhaAluno(a, mesAtual()); }).join("") + '</div>'
      : '<div class="empty">Nenhum aluno aqui.</div>';
  }

  function renderPag() {
    var el = $("v-pag");
    var lista = estado.pagamentos.slice().sort(function (x, y) { return (y.data + y.ts) > (x.data + x.ts) ? 1 : -1; });
    if (!lista.length) { el.innerHTML = '<div class="empty"><strong>Sem pagamentos</strong>Regista com o <b>+</b> ou no Resumo, no botão <b>Pagar</b>.</div>'; return; }
    var grupos = [], g = null;
    lista.forEach(function (p) {
      var k = p.data.slice(0, 7);
      if (!g || g.k !== k) { g = { k: k, l: [], t: 0 }; grupos.push(g); }
      g.l.push(p); g.t += p.valor;
    });
    el.innerHTML = grupos.map(function (gr) {
      return '<div class="sec">Recebido em ' + mesNome(gr.k) + '<small class="num">' + money(gr.t) + '</small></div><div class="group">' +
        gr.l.map(function (p) {
          var a = aluno(p.alunoId);
          return '<div class="item tap" data-pag="' + p.id + '"><div class="av">' + esc(iniciais(a ? a.nome : "?")) + '</div>' +
            '<div class="it-main"><div class="it-t">' + esc(a ? a.nome : "Aluno apagado") + '</div>' +
            '<div class="it-s">' + esc(mesNome(p.mes)) + ' · ' + dataPT(p.data) + (p.metodo ? " · " + esc(p.metodo) : "") + '</div></div>' +
            '<div class="it-r"><span class="it-v num">' + money(p.valor) + '</span></div></div>';
        }).join("") + '</div>';
    }).join("");
  }

  function renderDef() {
    var el = $("v-def");
    var uc = estado.ultimaCopia;
    el.innerHTML =
      '<div class="sec">Dia de pagamento</div>' +
      '<div class="group" style="padding:12px">' +
        '<div class="field" style="margin:0"><label for="df-dia">Os alunos pagam até ao dia</label>' +
        '<input id="df-dia" type="number" inputmode="numeric" min="1" max="31" value="' + estado.config.dia + '">' +
        '<span class="hint">Depois deste dia, quem não pagou aparece como atrasado. Cada aluno pode ter um dia diferente (na ficha dele).</span></div>' +
      '</div>' +
      '<div class="sec">Tipos de mensalidade<small>' + estado.planos.length + '</small></div>' +
      '<div class="group">' + estado.planos.map(function (p) {
        var n = estado.alunos.filter(function (a) { return a.planoId === p.id && a.ativo; }).length;
        return '<div class="item tap" data-plano="' + p.id + '"><div class="it-main"><div class="it-t">' + esc(p.nome) + '</div>' +
          '<div class="it-s">' + n + (n === 1 ? " aluno ativo" : " alunos ativos") + '</div></div><div class="it-r"><span class="it-v num">' + money(p.valor) + '</span></div></div>';
      }).join("") +
        '<div class="item tap" data-go="novoPlano"><div class="it-main"><div class="it-t" style="color:var(--accent)">+ Adicionar tipo de mensalidade</div></div></div>' +
      '</div>' +
      '<div class="sec">Cópia de segurança</div>' +
      '<div class="group" style="padding:12px">' +
        '<p class="note" style="margin:0 0 10px;padding:0">Os dados ficam gravados neste telemóvel. De vez em quando guarda uma cópia (em Ficheiros, WhatsApp ou email) — serve para repor se mudares de telemóvel ou se os dados se apagarem.</p>' +
        '<div class="kv"><span>Última cópia</span><span>' + (uc ? new Date(uc).toLocaleDateString("pt-PT") : "nunca") + '</span></div>' +
        '<button class="btn" data-go="exportar">Guardar cópia</button>' +
        '<button class="btn ghost" data-go="importar">Repor a partir de uma cópia</button>' +
      '</div>' +
      '<div class="sec">Instalar no iPhone</div>' +
      '<div class="group" style="padding:12px"><p class="note" style="margin:0;padding:0">No Safari: botão <b>Partilhar</b> → <b>Adicionar ao ecrã principal</b>. Abre sempre a partir desse ícone — assim os dados não se perdem.</p></div>' +
      '<button class="btn danger" id="df-reset" style="margin-top:18px">Apagar todos os dados</button>' +
      '<p class="note" style="text-align:center;margin-top:6px">' + estado.alunos.length + ' alunos · ' + estado.pagamentos.length + ' pagamentos</p>';
    var inDia = $("df-dia");
    inDia.addEventListener("change", function () {
      var d = parseInt(inDia.value, 10);
      if (d >= 1 && d <= 31) { var antes = snap(); estado.config.dia = d; salvar(); toast("Dia de pagamento: " + d, antes); }
      else inDia.value = estado.config.dia;
    });
    confirmar($("df-reset"), "Confirmar: apagar tudo", function () {
      var antes = snap(); estado = vazio(); salvar(); toast("Dados apagados", antes);
    });
  }

  function renderBanners() {
    var b = [];
    if (!localOK) b.push('<div class="banner err">Este browser não deixa gravar dados (modo privado?). Abre no Safari normal.</div>');
    var temDados = estado.alunos.length > 0 && estado.pagamentos.length > 0;
    var dias = estado.ultimaCopia ? (Date.now() - estado.ultimaCopia) / 86400000 : Infinity;
    if (temDados && dias > 30 && vista !== "def") {
      b.push('<div class="banner warn"><span>' + (estado.ultimaCopia ? "Última cópia há " + Math.floor(dias) + " dias." : "Ainda não guardaste nenhuma cópia.") + '</span><button data-go="exportar">Guardar</button></div>');
    }
    $("banners").innerHTML = b.join("");
    $("banners").hidden = !b.length;
  }

  function renderBadge() {
    var n = estado.alunos.filter(function (a) { return atrasos(a).length; }).length;
    var el = $("badge");
    el.hidden = !n; el.textContent = n;
  }

  var pendente = false;
  function render() {
    if (pendente) return;
    pendente = true;
    requestAnimationFrame(function () {
      pendente = false;
      $("titulo").textContent = TITULOS[vista];
      $("mesnav").hidden = vista !== "resumo";
      $("mesLbl").textContent = mesNome(mesVista);
      $("fab").hidden = !(vista === "alunos" || vista === "pag");
      ["resumo", "alunos", "pag", "def"].forEach(function (v) { $(v === "resumo" ? "v-resumo" : v === "alunos" ? "v-alunos" : v === "pag" ? "v-pag" : "v-def").hidden = v !== vista; });
      renderBanners(); renderBadge();
      if (vista === "resumo") renderResumo();
      else if (vista === "alunos") renderAlunos();
      else if (vista === "pag") renderPag();
      else renderDef();
    });
  }

  /* ================= eventos ================= */
  Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (b) {
    b.addEventListener("click", function () {
      vista = b.dataset.v;
      Array.prototype.forEach.call(document.querySelectorAll("nav button"), function (x) { x.setAttribute("aria-current", String(x === b)); });
      $("main").scrollTop = 0;
      render();
    });
  });
  $("mesPrev").addEventListener("click", function () { mesVista = addMes(mesVista, -1); render(); });
  $("mesNext").addEventListener("click", function () { mesVista = addMes(mesVista, 1); render(); });
  $("mesLbl").addEventListener("click", function () { mesVista = mesAtual(); render(); });
  $("fab").addEventListener("click", function () {
    if (vista === "alunos") sheetAlunoForm(null);
    else sheetPagamento({});
  });
  $("qAlunos").addEventListener("input", function (e) { busca = e.target.value; render(); });
  $("segAlunos").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    filtro = b.dataset.f;
    Array.prototype.forEach.call($("segAlunos").children, function (x) { x.setAttribute("aria-pressed", String(x === b)); });
    render();
  });
  $("main").addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-wa]"))) { var aw = aluno(t.dataset.wa); if (aw) whatsapp(aw, mesVista); return; }
    if ((t = e.target.closest("[data-pagar]"))) { sheetPagamento({ alunoId: t.dataset.pagar, mes: mesVista }); return; }
    if ((t = e.target.closest("[data-go]"))) {
      var g = t.dataset.go;
      if (g === "novoPlano") sheetPlano(null);
      else if (g === "novoAluno") sheetAlunoForm(null);
      else if (g === "exportar") exportar();
      else if (g === "importar") $("fileImport").click();
      return;
    }
    if ((t = e.target.closest("[data-aluno]"))) { var a = aluno(t.dataset.aluno); if (a) sheetAluno(a); return; }
    if ((t = e.target.closest("[data-pag]"))) { var p = estado.pagamentos.find(function (x) { return x.id === t.dataset.pag; }); if (p) sheetPagamento(p); return; }
    if ((t = e.target.closest("[data-plano]"))) { var pl = plano(t.dataset.plano); if (pl) sheetPlano(pl); }
  });

  /* ================= arranque ================= */
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
  } catch (e) {}
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") gravar();
    else render();
  });
  window.addEventListener("pagehide", gravar);

  estado = normalizar(ler());
  render();
})();
</script>
</body>
</html>
